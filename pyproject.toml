[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-queimadas"
version = "1.0.0"
description = "Pipeline de dados e Dashboard para monitoramento e análise espacial de focos de queimadas no Brasil (INPE)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Leandro Cunha", email = "lcunhaleandro@gmail.com" }
]
keywords = ["queimadas", "inpe", "meio-ambiente", "data-science", "dashboard", "streamlit", "analise-espacial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "streamlit>=1.30.0",
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "altair>=5.0.0",
    "plotly>=5.18.0",
    "streamlit-extras>=0.3.0",
    "reportlab>=4.0.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.17.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
queimadas-pipeline = "scripts.pipeline:main"
queimadas-dashboard = "app_runner:main"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
